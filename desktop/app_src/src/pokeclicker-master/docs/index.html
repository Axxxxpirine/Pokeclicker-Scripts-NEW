<!DOCTYPE html>
<html>
<head><meta data-desktop-security="1" http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://bootswatch.com https://fonts.googleapis.com; img-src 'self' data: blob: https://static.wixstatic.com https://img.shields.io https://avatars.githubusercontent.com https://a.deviantart.net https://www.smogon.com; font-src 'self' data: https://fonts.gstatic.com; media-src 'self' data: blob:; connect-src 'self' https://discord.pokeclicker.com https://translations.pokeclicker.com; object-src 'none'; base-uri 'none'; frame-src 'none'; form-action 'none'; worker-src blob:">
    <title>Pokéclicker Setup</title>
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta charset="utf-8"/>
    <link href="assets/images/favicon.ico" rel="icon" type="image/x-icon"/>
    <!--Bootstrap-->
    <link href="libs/bootstrap.min.css" rel="stylesheet">

    <style>
    .loader {
        position: fixed;
        top: 0;
        height: 100%;
        width: 100%;
        background-color: #79c9fa;
        background-size: cover;
        z-index: 9999;
    }

    .loader-wrapper {
        height: 100%;
        width: 100%;
        position: relative;
    }

    .loader-pokeball {
        height: 96px;
        padding: 10px;
        animation:loader 1s ease-in-out infinite;
    }

    @keyframes loader {
        0% {
            transform: rotate(0deg);
        }
        100% {
            transform: rotate(360deg);
        }
    }
    </style>

</head>
<body class="no-select">


<div class="loader" id="loader">
    <br>
    <div class="loader-wrapper">
        <div class="container">
            <div class="row">
                <div class="col-sm-8 offset-sm-2 text-center text-light">
                    <img style="width:100%" src="assets/images/pokeclickerlogo.png">
                    <img src="assets/images/pokeball/Pokeball.svg" class="loader-pokeball"/>
                    <br/>
                    <strong id="status">Downloading Files...</strong>
                </div>
            </div>
        </div>
    </div>

</div>
<script>
window.setStatus = status => document.getElementById('status').textContent = status;
</script>
</body>
</html>
